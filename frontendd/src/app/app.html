<div class="min-h-screen bg-slate-100 flex flex-col font-sans">
  <!-- Global Top Header Navigation -->
  <header class="sticky top-0 z-40 border-b border-slate-200/80 bg-white/95 px-4 py-2.5 backdrop-blur-md shadow-2xs sm:px-6">
    <div class="mx-auto flex max-w-7xl items-center justify-between">
      <!-- App Brand -->
      <div class="flex items-center gap-3">
        <a routerLink="/pos" class="flex items-center gap-2.5 text-slate-900 group">
          <div class="flex h-9 w-9 items-center justify-center rounded-xl bg-indigo-600 text-white shadow-sm group-hover:bg-indigo-700 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 21v-7.5a.75.75 0 0 1 .75-.75h3a.75.75 0 0 1 .75.75V21m-4.5 0H2.36m11.14 0H18m0 0h3.64m-1.39 0V9.349M3.75 21V9.349m0 0a3.001 3.001 0 0 0 3.75-.615A2.993 2.993 0 0 0 9.75 9.75c.896 0 1.7-.393 2.25-1.016a2.993 2.993 0 0 0 2.25 1.016c.896 0 1.7-.393 2.25-1.015a3.001 3.001 0 0 0 3.75.614m-16.5 0a3.004 3.004 0 0 1-.621-4.72l1.189-1.19A1.5 1.5 0 0 1 5.378 3h13.243a1.5 1.5 0 0 1 1.06.44l1.19 1.189a3 3 0 0 1-.621 4.72m-13.5 8.651h3m-3-3h3m7.5 3h3m-3-3h3" />
            </svg>
          </div>
          <div class="flex flex-col">
            <span class="text-sm font-extrabold tracking-tight text-slate-900 leading-none">POS System</span>
            <span class="text-[10px] text-slate-400 font-medium leading-tight">Retail & Inventory</span>
          </div>
        </a>
      </div>

      <!-- Navigation Tabs -->
      <nav class="flex items-center gap-1.5 rounded-xl bg-slate-100 p-1 border border-slate-200/60">
        <!-- Point of Sale Tab -->
        <a
          routerLink="/pos"
          routerLinkActive="bg-white text-indigo-700 shadow-xs font-semibold"
          [routerLinkActiveOptions]="{ exact: true }"
          class="inline-flex items-center gap-1.5 rounded-lg px-3.5 py-1.5 text-xs font-medium text-slate-600 transition hover:text-slate-900"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
          </svg>
          <span>Point of Sale</span>
          @if (posService.cartItemCount() > 0) {
            <span class="flex h-4 min-w-4 items-center justify-center rounded-full bg-indigo-600 px-1 text-[9px] font-bold text-white">
              {{ posService.cartItemCount() }}
            </span>
          }
        </a>

        <!-- Product Inventory Tab -->
        <a
          routerLink="/products"
          routerLinkActive="bg-white text-indigo-700 shadow-xs font-semibold"
          class="inline-flex items-center gap-1.5 rounded-lg px-3.5 py-1.5 text-xs font-medium text-slate-600 transition hover:text-slate-900"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="m20.25 7.5-.625 10.632a2.25 2.25 0 0 1-2.247 2.118H6.622a2.25 2.25 0 0 1-2.247-2.118L3.75 7.5M10 11.25h4M3.375 7.5h17.25c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125H3.375c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125Z" />
          </svg>
          <span>Products Management</span>
        </a>
      </nav>

      <!-- Right Quick Info -->
      <div class="hidden sm:flex items-center gap-3">
        <div class="text-right">
          <div class="text-xs font-semibold text-slate-700">Terminal #01</div>
          <div class="text-[10px] text-emerald-600 flex items-center justify-end gap-1 font-medium">
            <span class="h-1.5 w-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
            Ready for Orders
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- Page Content from Router -->
  <main class="flex-1">
    <router-outlet></router-outlet>
  </main>
</div>
