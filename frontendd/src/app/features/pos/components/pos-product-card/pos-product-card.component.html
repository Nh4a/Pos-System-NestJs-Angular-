<div
  (click)="onCardClick()"
  [class.opacity-60]="isOutOfStock()"
  [class.cursor-not-allowed]="isOutOfStock()"
  [class.cursor-pointer]="!isOutOfStock()"
  [class.border-[#00B074]]="quantityInCart() > 0"
  [class.ring-2]="quantityInCart() > 0"
  [class.ring-emerald-100]="quantityInCart() > 0"
  class="product-card bg-white rounded-2xl border border-slate-200/80 p-3.5 relative flex flex-col justify-between h-[210px] shadow-xs select-none transition group hover:border-[#00B074]"
>
  <!-- Top Right Floating Badges -->
  @if (quantityInCart() > 0) {
    <span class="absolute top-3 right-3 bg-[#00B074] text-white text-[10px] font-bold px-2 py-0.5 rounded-full z-10 shadow-sm flex items-center gap-1">
      <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
      </svg>
      {{ quantityInCart() }}
    </span>
  } @else if (isOutOfStock()) {
    <span class="absolute top-3 right-3 bg-rose-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full z-10 shadow-sm">
      Out of Stock
    </span>
  } @else if (isLowStock()) {
    <span class="absolute top-3 right-3 bg-amber-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full z-10 shadow-sm">
      Only {{ product().stockQty }} left
    </span>
  } @else if (product().id % 2 === 0) {
    <span class="absolute top-3 right-3 bg-[#00B074] text-white text-[10px] font-bold px-2 py-0.5 rounded-full z-10 shadow-sm">
      Hot Deal
    </span>
  }

  <!-- Image Container -->
  <div class="h-28 w-full rounded-xl overflow-hidden mb-2 bg-slate-50 flex items-center justify-center relative">
    <img
      [src]="product().imageUrl || fallbackImage"
      (error)="onImageError($event)"
      [alt]="product().productName"
      class="h-full w-full object-cover transition-transform duration-300 group-hover:scale-105"
      loading="lazy"
    />
  </div>

  <!-- Product Details & Price -->
  <div>
    <h3
      class="text-xs font-bold text-slate-800 truncate group-hover:text-[#00B074] transition"
      [title]="product().productName"
    >
      {{ product().productName }}
    </h3>
    <div class="flex items-center justify-between mt-1">
      <div class="flex items-center space-x-2">
        <span class="text-sm font-extrabold text-slate-900">
          ${{ product().unitPrice | number: '1.2-2' }}
        </span>
      </div>

      <!-- Quick Add Plus Button -->
      <button
        type="button"
        [disabled]="isOutOfStock()"
        (click)="$event.stopPropagation(); onCardClick()"
        class="w-6 h-6 rounded-lg bg-emerald-50 text-[#00B074] group-hover:bg-[#00B074] group-hover:text-white flex items-center justify-center transition active:scale-90"
        title="Add to order"
      >
        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path>
        </svg>
      </button>
    </div>
  </div>
</div>
